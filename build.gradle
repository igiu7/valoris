plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        url "https://maven.ftb.dev/releases"
        content { includeGroup "dev.ftb.mods" }
    }
    maven { url "https://maven.architectury.dev/" }
    // JLayer (MP3 decoder for the game music)
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "dev.ftb.mods:ftb-library-neoforge:2101.1.37"
    implementation "dev.ftb.mods:ftb-teams-neoforge:2101.1.11"
    implementation "dev.ftb.mods:ftb-chunks-neoforge:2101.1.22"
    implementation "dev.architectury:architectury-neoforge:13.0.8"

    // optional compat (compat mixins apply only when the mod is installed): Trotting Wagons + its GeckoLib
    compileOnly files("libs/trotting_wagons-21.0.2.jar", "libs/geckolib-neoforge-1.21.1-4.9.3.jar")

    // MP3 decoder for the custom game music (assets/valoris2/music/*.mp3):
    // packed inside the mod jar, so players need nothing extra; the second line makes it work in runClient
    jarJar(implementation("javazoom:jlayer:1.0.1"))
    additionalRuntimeClasspath "javazoom:jlayer:1.0.1"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------
// Auto-deploy: po buildzie kopiuje jar do dwoch folderow mods
// i usuwa z nich poprzednie wersje tego moda.
// ---------------------------------------------------------------
def deployDirs = [
        "C:/Users/igiga/Documents/serwer/mods",
        "C:/Users/igiga/curseforge/minecraft/Instances/valoris 2/mods"
]

tasks.register('deployJar') {
    group = 'build'
    description = 'Kopiuje jar moda do folderow mods, podmieniajac stare wersje'
    dependsOn tasks.named('jar')

    // wartosci pobierane w fazie konfiguracji (wymagane przez configuration cache)
    def jarFileProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
    String prefix = mod_id + "-"
    List<String> dirs = deployDirs
    inputs.file(jarFileProvider)

    doLast {
        File jarFile = jarFileProvider.get().asFile

        dirs.each { String path ->
            File dir = new File(path)
            dir.mkdirs()

            // usun stare wersje tego moda (np. valoris2-1.0.0.jar)
            dir.listFiles()?.each { File f ->
                if (f.isFile() && f.name.startsWith(prefix) && f.name.endsWith(".jar")) {
                    f.delete()
                }
            }

            java.nio.file.Files.copy(
                    jarFile.toPath(),
                    new File(dir, jarFile.name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            println "Deployed ${jarFile.name} -> ${dir}"
        }
    }
}

tasks.named('jar') { finalizedBy 'deployJar' }
tasks.named('build') { finalizedBy 'deployJar' }